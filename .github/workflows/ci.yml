name: falconfleetops-ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.app.json
      - run: pnpm run build
      - run: pnpm run lint
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m unittest discover -s gateway/tests -v
      - run: node --check firmware-tooling/fleetops-sign.mjs
      - run: node --check firmware-tooling/verify-audit.mjs
      - run: test -s public/manus-routes.json
